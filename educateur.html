<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Tableau éducateur</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#263238;
}

main{
max-width:900px;
margin:auto;
padding:25px 15px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 8px 25px #0002;
}

h1{
text-align:center;
}

#login{
max-width:400px;
margin:40px auto;
text-align:center;
}

input{
width:100%;
padding:15px;
font-size:20px;
border:2px solid #ddd;
border-radius:12px;
text-align:center;
box-sizing:border-box;
}

button{
margin-top:15px;
padding:15px 25px;
border:0;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#loginBtn{
background:#1976d2;
color:white;
}

#dashboard{
display:none;
}

table{
width:100%;
border-collapse:collapse;
margin-top:25px;
}

th,td{
padding:14px 10px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#eceff1;
}

.refresh{
background:#43a047;
color:white;
}

.empty{
text-align:center;
padding:30px;
font-size:20px;
color:#607d8b;
}

.error{
color:#c62828;
font-weight:bold;
margin-top:15px;
}

@media(max-width:650px){

table{
font-size:14px;
}

th,td{
padding:10px 5px;
}

}

</style>

</head>


<body>

<main>

<div class="card" id="login">

<h1>🔐 Éducateur</h1>

<p>
Entre le code PIN pour accéder
aux attributions.
</p>

<input
id="pin"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Code PIN"
>

<button
id="loginBtn"
onclick="login()">

ACCÉDER AU TABLEAU

</button>

<div
id="error"
class="error">
</div>

</div>


<div class="card" id="dashboard">

<h1>📋 Attribution des tâches</h1>

<p id="date"></p>

<button
class="refresh"
onclick="loadAssignments()">

🔄 ACTUALISER

</button>

<div id="content"></div>

</div>

</main>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzLRE0n1-kRWC15vMrJbJ02kjufO0vS7c0mDe4qoOpc4mGmHTMSY1idYGWSZlHYheZD/exec";


let pin = "";


function login(){

pin =
document.getElementById(
"pin"
).value.trim();


if(!pin){

document.getElementById(
"error"
).textContent =
"Entre le code PIN.";

return;

}


loadAssignments();

}


async function loadAssignments(){

try{

const response =
await fetch(
API_URL +
"?action=assignments&pin=" +
encodeURIComponent(pin)
);


const data =
await response.json();


if(!data.ok){

document.getElementById(
"error"
).textContent =
data.message ||
"Code PIN incorrect.";

return;

}


document.getElementById(
"login"
).style.display =
"none";


document.getElementById(
"dashboard"
).style.display =
"block";


document.getElementById(
"date"
).textContent =
"📅 " + data.date;


displayAssignments(
data.assignments || []
);

}

catch(error){

document.getElementById(
"error"
).textContent =
"Impossible de contacter le serveur.";

}

}


function displayAssignments(assignments){

const content =
document.getElementById(
"content"
);


if(!assignments.length){

content.innerHTML =
`
<div class="empty">
🎁 Aucune tâche attribuée pour aujourd'hui.
</div>
`;

return;

}


let html = `

<table>

<thead>

<tr>

<th>👤 Jeune</th>

<th>👥 Groupe</th>

<th>🧹 Tâche</th>

<th>📅 Date</th>

</tr>

</thead>

<tbody>
`;


assignments.forEach(
item => {

html += `

<tr>

<td><b>
${escapeHtml(item.name)}
</b></td>

<td>
${escapeHtml(item.group)}
</td>

<td>
${escapeHtml(item.task)}
</td>

<td>
${escapeHtml(item.date)}
</td>

</tr>

`;

});


html += `

</tbody>

</table>
`;


content.innerHTML =
html;

}


function escapeHtml(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>

</html>
