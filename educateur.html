<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Tableau éducateur - Boîte Surprise Ménage</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#263238;
}

main{
max-width:1000px;
margin:auto;
padding:25px 15px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 8px 25px #0002;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#607d8b;
}

#login{
max-width:420px;
margin:50px auto;
text-align:center;
}

.pin-input{
width:100%;
padding:16px;
font-size:24px;
border:2px solid #cfd8dc;
border-radius:12px;
text-align:center;
letter-spacing:6px;
}

button{
border:0;
border-radius:12px;
padding:13px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#loginBtn{
background:#1976d2;
color:white;
width:100%;
margin-top:15px;
}

#dashboard{
display:none;
}

.actions{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px 0;
}

.refresh{
background:#43a047;
color:white;
}

.print{
background:#757575;
color:white;
}

.logout{
background:#e53935;
color:white;
}

#date{
text-align:center;
font-weight:bold;
font-size:18px;
}

#error{
color:#c62828;
font-weight:bold;
margin-top:15px;
}

.summary{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin:20px 0;
}

.summary-box{
background:#f5f5f5;
border-radius:14px;
padding:15px 25px;
text-align:center;
}

.summary-number{
font-size:28px;
font-weight:bold;
}

.summary-label{
color:#607d8b;
font-size:14px;
}

.table-container{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:13px 10px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#eceff1;
}

.done{
background:#43a047;
color:white;
}

.done-status{
color:#2e7d32;
font-weight:bold;
}

.todo-status{
color:#ef6c00;
font-weight:bold;
}

.empty{
text-align:center;
padding:35px 10px;
font-size:20px;
color:#607d8b;
}

@media(max-width:650px){

main{
padding:10px;
}

.card{
padding:15px 10px;
}

th,td{
padding:9px 6px;
font-size:13px;
}

button{
font-size:14px;
padding:10px 12px;
}

}

/* IMPRESSION */

@media print{

@page{
margin:15mm;
}

body{
background:white;
}

main{
max-width:none;
padding:0;
}

.card{
box-shadow:none;
border-radius:0;
padding:0;
}

#login{
display:none !important;
}

#dashboard{
display:block !important;
}

.actions{
display:none !important;
}

h1{
font-size:26px;
}

table{
font-size:13px;
}

th,td{
border:1px solid #999;
padding:8px;
}

}

</style>

</head>


<body>

<main>


<!-- CONNEXION -->

<div
class="card"
id="login">

<h1>🔐 Accès éducateur</h1>

<p class="subtitle">
Tableau des tâches
</p>

<input
id="pin"
class="pin-input"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••"
autocomplete="off"
>

<button
id="loginBtn"
onclick="login()">

ACCÉDER AU TABLEAU

</button>

<div id="error"></div>

</div>


<!-- TABLEAU -->

<div
class="card"
id="dashboard">

<h1>
📋 Attribution des tâches
</h1>

<div id="date"></div>


<div class="actions">

<button
class="refresh"
onclick="loadAssignments()">

🔄 ACTUALISER

</button>

<button
class="print"
onclick="window.print()">

📄 IMPRIMER

</button>

<button
class="logout"
onclick="logout()">

🚪 QUITTER

</button>

</div>


<!-- RÉSUMÉ -->

<div class="summary">

<div class="summary-box">

<div
id="totalNumber"
class="summary-number">

0

</div>

<div class="summary-label">
Tâches
</div>

</div>


<div class="summary-box">

<div
id="doneNumber"
class="summary-number">

0

</div>

<div class="summary-label">
Faites
</div>

</div>


<div class="summary-box">

<div
id="todoNumber"
class="summary-number">

0

</div>

<div class="summary-label">
À faire
</div>

</div>

</div>


<div id="content"></div>

</div>

</main>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzLRE0n1-kRWC15vMrJbJ02kjufO0vS7c0mDe4qoOpc4mGmHTMSY1idYGWSZlHYheZD/exec";


let pin = "";


/*************************************************
 * CONNEXION
 *************************************************/

function login(){

pin =
document.getElementById("pin")
.value.trim();


if(!pin){

document.getElementById("error")
.textContent =
"Entre le code PIN.";

return;

}


document.getElementById("error")
.textContent = "";

loadAssignments();

}


/*************************************************
 * CHARGER LES ATTRIBUTIONS
 *************************************************/

async function loadAssignments(){

try{

const response =
await fetch(

API_URL +
"?action=assignments&pin=" +
encodeURIComponent(pin)

);


const data =
await response.json();


if(!data.ok){

document.getElementById("error")
.textContent =
data.message ||
"Code PIN incorrect.";

return;

}


document.getElementById("login")
.style.display = "none";


document.getElementById("dashboard")
.style.display = "block";


document.getElementById("date")
.textContent =
"📅 " + data.date;


displayAssignments(
data.assignments || []
);

}

catch(error){

document.getElementById("error")
.textContent =
"Impossible de contacter le serveur.";

}

}


/*************************************************
 * AFFICHER LES ATTRIBUTIONS
 *************************************************/

function displayAssignments(assignments){

const content =
document.getElementById("content");


const total =
assignments.length;


const done =
assignments.filter(
item => item.completed === true
).length;


const todo =
total - done;


document.getElementById("totalNumber")
.textContent = total;


document.getElementById("doneNumber")
.textContent = done;


document.getElementById("todoNumber")
.textContent = todo;


if(!assignments.length){

content.innerHTML = `

<div class="empty">

🎁 Aucune tâche attribuée aujourd'hui.

</div>

`;

return;

}


let html = `

<div class="table-container">

<table>

<thead>

<tr>

<th>👤 Jeune</th>

<th>👥 Groupe</th>

<th>🧹 Tâche</th>

<th>État</th>

</tr>

</thead>

<tbody>

`;


assignments.forEach(
item => {

const safeName =
escapeHtml(item.name);

const safeGroup =
escapeHtml(item.group);

const safeTask =
escapeHtml(item.task);

const safeDate =
escapeHtml(item.date);


if(item.completed === true){

html += `

<tr>

<td>
<b>${safeName}</b>
</td>

<td>
${safeGroup}
</td>

<td>
${safeTask}
</td>

<td>

<span class="done-status">
✅ FAITE
</span>

<br>

<small>${safeDate}</small>

</td>

</tr>

`;

}

else{

html += `

<tr>

<td>
<b>${safeName}</b>
</td>

<td>
${safeGroup}
</td>

<td>
${safeTask}
</td>

<td>

<button
class="done"
onclick='completeTask(
${JSON.stringify(item.name)},
${JSON.stringify(item.group)},
${JSON.stringify(item.date)}
)'>

✅ MARQUER FAITE

</button>

</td>

</tr>

`;

}

});


html += `

</tbody>

</table>

</div>

`;

content.innerHTML =
html;

}


/*************************************************
 * MARQUER UNE TÂCHE COMME FAITE
 *************************************************/

async function completeTask(
name,
group,
date
){

if(
!confirm(
"Confirmer que la tâche de " +
name +
" est terminée ?"
)
){

return;

}


const apiGroup =
group === "Filles"
? "filles"
: "garcons";


try{

const response =
await fetch(

API_URL,

{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"complete",

pin:pin,

name:name,

group:apiGroup,

date:date

})

}

);


const data =
await response.json();


if(data.ok){

loadAssignments();

}

else{

alert(
data.message ||
"Impossible de modifier la tâche."
);

}

}

catch(error){

alert(
"Impossible de contacter le serveur."
);

}

}


/*************************************************
 * SÉCURITÉ AFFICHAGE
 *************************************************/

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*************************************************
 * QUITTER
 *************************************************/

function logout(){

pin = "";

document.getElementById("pin")
.value = "";

document.getElementById("dashboard")
.style.display = "none";

document.getElementById("login")
.style.display = "block";

}

</script>

</body>

</html>
